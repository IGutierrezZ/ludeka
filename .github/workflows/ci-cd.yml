name: Ludeka CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - 'openspec/**'
      - '**/*.md'
      - '.claude/**'
      - '.gemini/**'
      - '.agents/**'
      - '.vscode/**'
      - '.gitignore'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - 'openspec/**'
      - '**/*.md'
      - '.claude/**'
      - '.gemini/**'
      - '.agents/**'
      - '.vscode/**'
      - '.gitignore'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  # =========================================================================
  # 1. Integración Continua (CI): Compilación, Tests y Verificación Docker
  # =========================================================================
  build-and-test:
    name: Build & Test (.NET 10)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js 20 (para Tailwind CLI)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Caché de paquetes NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Ludeka.sln') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restaurar dependencias NuGet
        run: dotnet restore Ludeka.sln

      - name: Compilar solución (Release)
        run: dotnet build Ludeka.sln --configuration Release --no-restore

      - name: Ejecutar Suite Completa de Pruebas Unitarias
        run: dotnet test Ludeka.sln --configuration Release --no-build --verbosity normal

      - name: Verificar construcción de imagen Docker
        if: github.ref == 'refs/heads/main'
        run: docker build -t ludeka:ci .

  # =========================================================================
  # 2. Despliegue Continuo (CD): Google Cloud Run (Solo en merge a main)
  # =========================================================================
  deploy-cloudrun:
    name: Deploy to Google Cloud Run
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código fuente
        uses: actions/checkout@v4

      - name: Verificar configuración de secretos de Google Cloud
        id: check-secrets
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -n "$GCP_PROJECT_ID" ] && [ -n "$GCP_SA_KEY" ]; then
            echo "has_gcp=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_gcp=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Secretos GCP_PROJECT_ID o GCP_SA_KEY no configurados en GitHub Secrets. Omitiendo despliegue automático a Cloud Run."
          fi

      - name: Autenticación con Google Cloud
        if: steps.check-secrets.outputs.has_gcp == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configurar Google Cloud SDK
        if: steps.check-secrets.outputs.has_gcp == 'true'
        uses: google-github-actions/setup-gcloud@v2

      - name: Configurar Docker para Google Artifact Registry
        if: steps.check-secrets.outputs.has_gcp == 'true'
        run: gcloud auth configure-docker ${{ secrets.GCP_REGION || 'europe-west1' }}-docker.pkg.dev --quiet

      - name: Construir y etiquetar imagen de producción
        if: steps.check-secrets.outputs.has_gcp == 'true'
        env:
          REGION: ${{ secrets.GCP_REGION || 'europe-west1' }}
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          IMAGE_NAME: ${{ secrets.GCP_REGION || 'europe-west1' }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/ludeka/ludeka-web:${{ github.sha }}
        run: |
          docker build -t $IMAGE_NAME .
          docker push $IMAGE_NAME

      # INC-48 (diseño §3): deploy-cloudrun@v2 no expone entradas nativas de sondas, y su entrada
      # "metadata" no sirve aquí (ignora el resto de entradas del paso). La vía usada es "flags",
      # que reenvía banderas arbitrarias a "gcloud run deploy". Sintaxis verificada solo contra la
      # documentación oficial de esa orden, nunca contra un despliegue real (sin entorno de GCP en
      # este ciclo) — ver docs/deployment/google-cloud-run.md §8.1 antes del primer despliegue.
      - name: Desplegar revisión en Google Cloud Run
        if: steps.check-secrets.outputs.has_gcp == 'true'
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ secrets.GCP_SERVICE_NAME || 'ludeka-web' }}
          region: ${{ secrets.GCP_REGION || 'europe-west1' }}
          image: ${{ secrets.GCP_REGION || 'europe-west1' }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/ludeka/ludeka-web:${{ github.sha }}
          # INC-48/Fix: --timeout=3600 (60m) evita que Cloud Run corte la conexión WebSocket de Blazor Server
          # al límite por defecto de 300s (código 1006 abnormal closure en cliente cada 5 minutos).
          flags: '--allow-unauthenticated --port=8080 --memory=1Gi --cpu=1 --min-instances=1 --max-instances=2 --cpu-boost --timeout=3600 --liveness-probe=httpGet.path=/healthz,httpGet.port=8080 --startup-probe=httpGet.path=/ready,httpGet.port=8080'
          env_vars: |
            ASPNETCORE_ENVIRONMENT=Production
            Database__Provider=PostgreSql
            Database__SeedDemoData=false
            Bgg__SimulateApi=false
            Gemini__Simulate=false
            YouTube__Simulate=false
            CommunityNotifications__DryRun=false
            Cloudflare__BucketName=ludeka-media
            Cloudflare__PublicCdnBaseUrl=https://pub-a0b33b365ae446c58f5e80b3dc493970.r2.dev
            Cloudflare__Simulate=false
            Authentication__Providers__Google__Enabled=true
            Authentication__Providers__Discord__Enabled=true
            Authentication__Providers__Facebook__Enabled=true
            Instagram__Simulate=false
            Instagram__PublicBaseUrl=https://ludeka.es
            Gemini__Model=${{ vars.GEMINI_MODEL || 'gemini-3.6-flash' }}
          secrets: |
            ConnectionStrings__DefaultConnection=SUPABASE_DB_CONNECTION:latest
            Gemini__ApiKey=GEMINI_API_KEY:latest
            Bgg__ApiToken=BGG_API_TOKEN:latest
            YouTube__ApiKey=YOUTUBE_API_KEY:latest
            CommunityNotifications__DiscordWebhookUrl=DISCORD_WEBHOOK_URL:latest
            CommunityNotifications__TelegramBotToken=TELEGRAM_BOT_TOKEN:latest
            CommunityNotifications__TelegramChatId=TELEGRAM_CHAT_ID:latest
            Cloudflare__AccountId=CLOUDFLARE_ACCOUNT_ID:latest
            Cloudflare__AccessKeyId=CLOUDFLARE_ACCESS_KEY_ID:latest
            Cloudflare__SecretAccessKey=CLOUDFLARE_SECRET_ACCESS_KEY:latest
            Authentication__Providers__Google__ClientId=GOOGLE_OAUTH_CLIENT_ID:latest
            Authentication__Providers__Google__ClientSecret=GOOGLE_OAUTH_CLIENT_SECRET:latest
            Authentication__Providers__Discord__ClientId=DISCORD_OAUTH_CLIENT_ID:latest
            Authentication__Providers__Discord__ClientSecret=DISCORD_OAUTH_CLIENT_SECRET:latest
            Authentication__Providers__Facebook__AppId=FACEBOOK_OAUTH_APP_ID:latest
            Authentication__Providers__Facebook__AppSecret=FACEBOOK_OAUTH_APP_SECRET:latest
            Instagram__AccessToken=INSTAGRAM_ACCESS_TOKEN:latest
            Instagram__InstagramAccountId=INSTAGRAM_ACCOUNT_ID:latest
            AdminUser__Email=ADMIN_USER_EMAIL:latest

      # INC-47, R6 (diseño §8.9): un Cloud Run Job por trabajo, los cuatro sobre la MISMA imagen
      # ya publicada arriba — el ENTRYPOINT por defecto arranca el servicio web y cada Job
      # sobrescribe el comando del contenedor (diseño §8.7, decisión 5). Variables de entorno y
      # secretos equivalentes a los del paso de arriba. Hueco de evidencia declarado por el diseño
      # (§8.9): la ortografía exacta de las banderas de "gcloud run jobs deploy" y la disponibilidad
      # de un modo "job" en deploy-cloudrun@v2 no se han verificado contra GCP real en este ciclo;
      # el maintainer confirma la sintaxis al provisionar (checklist manual, tarea 10.17-10.20).
      - name: Publicar la revisión de los Cloud Run Jobs
        if: steps.check-secrets.outputs.has_gcp == 'true'
        env:
          REGION: ${{ secrets.GCP_REGION || 'europe-west1' }}
          IMAGE_NAME: ${{ secrets.GCP_REGION || 'europe-west1' }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/ludeka/ludeka-web:${{ github.sha }}
        run: |
          for JOB in nightly-cataloging price-radar social-collector notification-outbox seed-staging drain-staging feed-sync editorial-releases-sync devir-images-backfill; do
            gcloud run jobs deploy "ludeka-job-${JOB}" \
              --image "${IMAGE_NAME}" \
              --region "${REGION}" \
              --command dotnet \
              --args "Ludeka.Jobs.dll,${JOB}" \
              --set-env-vars ASPNETCORE_ENVIRONMENT=Production,Database__Provider=PostgreSql,Database__SeedDemoData=false,Bgg__SimulateApi=false,Gemini__Simulate=false,YouTube__Simulate=false,CommunityNotifications__DryRun=false,Cloudflare__BucketName=ludeka-media,Cloudflare__PublicCdnBaseUrl=https://pub-a0b33b365ae446c58f5e80b3dc493970.r2.dev,Cloudflare__Simulate=false,Gemini__Model=${{ vars.GEMINI_MODEL || 'gemini-3.6-flash' }} \
              --set-secrets ConnectionStrings__DefaultConnection=SUPABASE_DB_CONNECTION:latest,Gemini__ApiKey=GEMINI_API_KEY:latest,Bgg__ApiToken=BGG_API_TOKEN:latest,YouTube__ApiKey=YOUTUBE_API_KEY:latest,CommunityNotifications__DiscordWebhookUrl=DISCORD_WEBHOOK_URL:latest,CommunityNotifications__TelegramBotToken=TELEGRAM_BOT_TOKEN:latest,CommunityNotifications__TelegramChatId=TELEGRAM_CHAT_ID:latest,Cloudflare__AccountId=CLOUDFLARE_ACCOUNT_ID:latest,Cloudflare__AccessKeyId=CLOUDFLARE_ACCESS_KEY_ID:latest,Cloudflare__SecretAccessKey=CLOUDFLARE_SECRET_ACCESS_KEY:latest
          # Nota: sin Media__LocalStoragePath — los Cloud Run Jobs no comparten disco con el servicio
          # web (diseño §D6); con las credenciales de Cloudflare arriba, R2 gana la precedencia de
          # tres vías y la catalogación nocturna no depende de un volumen que no existe en los Jobs.
          done
