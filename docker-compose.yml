# Entorno LOCAL de desarrollo/pruebas manuales con SQLite (INC-48, PR2). NO es una vía de
# despliegue a producción -esa es docker-compose.prod.yml, fuera de alcance de este incremento-.
# ASPNETCORE_ENVIRONMENT por defecto es Staging, no Production: con la guarda de arranque de
# WebStartupGuards activa, un valor por defecto de Production abortaría aquí el arranque, al no
# haber ninguna conexión PostgreSQL configurada en este fichero.
services:
  ludeka-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ludeka-web
    restart: unless-stopped
    ports:
      - "${PORT:-5081}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Staging}
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/ludeka.db
    env_file:
      - path: .env
        required: false
    volumes:
      - ludeka_data:/app/data
      - ludeka_logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - ludeka-network

volumes:
  ludeka_data:
    name: ludeka_data
  ludeka_logs:
    name: ludeka_logs

networks:
  ludeka-network:
    name: ludeka_network
    driver: bridge
