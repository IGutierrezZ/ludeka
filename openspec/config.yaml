schema: "1.0"
mode: "hybrid"
language: "es"
language_rules:
  artifacts: "es"
  chat: "es"
context: |
  Ludist / Ludeka — "Juegos, sorteos, eventos y opiniones de verdad. Bienvenido a tu mesa.".
  Arquitectura: .NET 10 (C# 13), Blazor Web App (SSR + Interactivo), Clean Architecture / Vertical Slices.
  Memoria persistente: Engram MCP. UI: Tailwind CSS + componentes propios/Lucide Icons.
  IDIOMA OBLIGATORIO: Todos los artefactos de SDD, propuestas, especificaciones, tareas y comunicaciones deben estar redactados en español (castellano).
strict_tdd: true
testing:
  workspace_command: "dotnet test Ludeka.sln"
  framework: "xUnit (.NET 10)"
projects:
  - path: "src/Ludeka.Web"
    stack: ".NET 10 Blazor Web App"
    test_command: "dotnet test Ludeka.sln"
  - path: "src/Ludeka.Core"
    stack: ".NET 10 Class Library"
    test_command: "dotnet test Ludeka.sln"
  - path: "src/Ludeka.Application"
    stack: ".NET 10 Class Library"
    test_command: "dotnet test Ludeka.sln"
  - path: "src/Ludeka.Infrastructure"
    stack: ".NET 10 Class Library"
    test_command: "dotnet test Ludeka.sln"
  - path: "tests/Ludeka.UnitTests"
    stack: ".NET 10 xUnit"
    test_command: "dotnet test tests/Ludeka.UnitTests/Ludeka.UnitTests.csproj"
  - path: "src/Ludeka.Jobs"
    stack: ".NET 10 Console (host de trabajos en segundo plano, Cloud Run Jobs)"
    test_command: "dotnet test Ludeka.sln"
  - path: "tests/Ludeka.IntegrationTests"
    stack: ".NET 10 xUnit (PostgreSQL real vía Testcontainers)"
    test_command: "dotnet test tests/Ludeka.IntegrationTests/Ludeka.IntegrationTests.csproj"
